name: container
# Publishing waits on the gate: workflow_run fires once gate.yml finishes, and
# the publish job runs only when that run succeeded, for a push to main or a v*
# tag, and builds the exact commit the gate passed (head_sha), not whatever main
# points at by then. That commit must be on main either way, so a tag on an
# unmerged commit publishes nothing, and :latest goes only to main's current tip.
# Pull requests build the image without pushing it.
on:
  pull_request:
  workflow_run:
    workflows: [gate]
    types: [completed]
permissions: {}
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    # head_branch carries the tag name for a tag-triggered run. A push runs the
    # gate.yml at the pushed commit, so a branch or tag can add its own trigger
    # and arrive here under any name. This filters by name only; the tags step
    # checks the commit against the real main branch and tag refs.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One queue per ref, so an older main build cannot finish last and leave
    # :latest pointing behind the newest green commit. A re-run of an older run
    # is not in that queue's order; the tip check in the tags step covers it.
    concurrency:
      group: container-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Every branch and tag, for the ref checks in the tags step.
          fetch-depth: 0
          persist-credentials: false
      # docker/metadata-action reads github.sha and github.ref, which under
      # workflow_run name the default branch's tip rather than the gated commit,
      # so the tags are computed from the triggering run instead. Whatever the
      # ref's name, a commit off main publishes nothing, and so does a branch
      # named v1. An older main commit, from a re-run, gets only its sha tag.
      - id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/zoo-sites
          SHA: ${{ github.event.workflow_run.head_sha }}
          REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          image="${IMAGE,,}"
          tags="${image}:sha-${SHA::7}"
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "::error::${REF} at ${SHA} is not on main; publishing nothing"
            exit 1
          elif [ "$REF" = main ]; then
            if [ "$SHA" = "$(git rev-parse refs/remotes/origin/main)" ]; then
              tags="${tags},${image}:latest"
            fi
          elif [[ "$REF" == v* ]] && [ "$(git rev-parse -q --verify "refs/tags/${REF}^{commit}")" = "$SHA" ]; then
            tags="${tags},${image}:${REF//[^A-Za-z0-9_.-]/-}"
          else
            echo "::error::${REF} at ${SHA} is neither main nor a v* tag; publishing nothing"
            exit 1
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
